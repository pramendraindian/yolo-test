# YOLOv5s model configuration for training
# For more details, see: https://github.com/ultralytics/yolov5/blob/master/models/yolov5s.yaml

nc: 3  # number of classes, update this to match your dataset

# anchors
anchors:
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5s backbone
backbone:
  [[-1, 1, Conv, [32, 3, 1]],
   [-1, 1, Conv, [64, 3, 2]],
   [-1, 1, BottleneckCSP, [64]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, BottleneckCSP, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 3, BottleneckCSP, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 1, SPP, [512, [5, 9, 13]]],
   [-1, 1, BottleneckCSP, [512, False]],
  ]

# YOLOv5s head
head:
  [[-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],
   [-1, 1, BottleneckCSP, [256, False]],

   [-1, 1, Conv, [128, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],
   [-1, 1, BottleneckCSP, [128, False]],

   [-1, 1, Conv, [128, 3, 2]],
   [[-1, 14], 1, Concat, [1]],
   [-1, 1, BottleneckCSP, [256, False]],

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 10], 1, Concat, [1]],
   [-1, 1, BottleneckCSP, [512, False]],

   [[17, 20, 23], 1, Detect, [nc, anchors]],
  ]
